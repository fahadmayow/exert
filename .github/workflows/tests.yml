name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: ^12.51
            testbench: ^10.0
            php: '8.2'
            dependencies: lowest
          - laravel: ^12.51
            testbench: ^10.0
            php: '8.5'
            dependencies: latest
          - laravel: ^13.0
            testbench: ^11.0
            php: '8.3'
            dependencies: lowest
          - laravel: ^13.0
            testbench: ^11.0
            php: '8.5'
            dependencies: latest
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer require --no-update "laravel/framework:${{ matrix.laravel }}"
      - run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Install latest supported dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
